language: en-US
tone_instructions: "Thin wrapper around Pandora.com's JSON API. Maintain strict API fidelity - mirror JSON exactly, preserve compatibility, minimal deps. Follow patterns in auth.go, station.go, user.go, misc.go. Preserve JSON tags as-is."
early_access: true
enable_free_tier: false
reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: "Use conventional commit format: <type>(<scope>): <description>. Types: feat, fix, docs, test, refactor, chore, perf. Scopes: auth, station, user, misc, requests, responses, client, encryption, ci, deps. Examples: feat(auth): add UserLogin method, fix(station): correct GetStationList error handling, test(user): add integration tests for GetUserProfile, docs: update API documentation, refactor(client): improve error wrapping in PandoraCall"
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: true
  poem: true
  labeling_instructions:
    - label: "type:feature"
      instructions: "Use for new functionality and enhancements"
    - label: "type:bug"
      instructions: "Use for bug fixes and defect corrections"
    - label: "priority:critical"
      instructions: "Use for critical issues and urgent fixes"
    - label: "priority:high"
      instructions: "Use for high priority issues and important features"
    - label: "priority:normal"
      instructions: "Use for standard work and regular features"
    - label: "go"
      instructions: "Use for Go code changes and modifications"
    - label: "dependencies"
      instructions: "Use for dependency updates and package changes"
    - label: "documentation"
      instructions: "Use for documentation improvements and updates"
    - label: "testing"
      instructions: "Use for test-related changes and test infrastructure"
    - label: "performance"
      instructions: "Use for performance optimizations and improvements"
    - label: "ci"
      instructions: "Use for CI/CD and GitHub Actions changes"
    - label: "breaking_change"
      instructions: "Use for incompatible changes and major updates"
    - label: "audit"
      instructions: "Use for audit compliance and report generation work"
  path_filters: []
  path_instructions:
    - path: "gopiano.go"
      instructions: "Core client file. Contains Client struct, encryption/decryption methods, PandoraCall, and BlowfishCall. Review for proper error handling, encryption correctness, and HTTP client usage. Ensure timeOffset calculations are correct."
    - path: "auth.go"
      instructions: "Authentication methods. Follow pattern: create request struct, marshal JSON, call PandoraCall/BlowfishCall, handle response. Must set partnerAuthToken/partnerID or userAuthToken/userID on client. Include SyncTime for authenticated calls."
    - path: "station.go"
      instructions: "Station-related API methods. Follow same pattern as auth.go. Use BlowfishCall for encrypted requests. Include SyncTime: c.GetSyncTime() for authenticated calls. Methods should match Pandora API method names."
    - path: "user.go"
      instructions: "User-related API methods. Follow same pattern as auth.go. Use BlowfishCall for encrypted requests. Include SyncTime: c.GetSyncTime() for authenticated calls. Methods should match Pandora API method names."
    - path: "misc.go"
      instructions: "Miscellaneous API methods. Follow same pattern as auth.go. Use BlowfishCall for encrypted requests. Include SyncTime: c.GetSyncTime() for authenticated calls. Methods should match Pandora API method names."
    - path: "requests/*.go"
      instructions: "Request structs for JSON marshaling. Must mirror Pandora API exactly - field names, types, and JSON tags must match API documentation. Preserve typos in JSON tags (use //nolint:tagliatelle). Use omitempty for optional fields. Add doc comments: 'MethodName represents the request data for api.methodName.'"
    - path: "responses/*.go"
      instructions: "Response structs for JSON unmarshaling. Must mirror Pandora API exactly - field names, types, and JSON tags must match API documentation. Preserve typos in JSON tags (use //nolint:tagliatelle). All responses have 'stat' field ('ok' or 'fail'). Add doc comments: 'MethodName represents the response from api.methodName.'"
    - path: "*_test.go"
      instructions: "Test files. Prefer table-driven tests. Use t.Parallel() when safe. Keep tests deterministic. For integration tests, use //go:build integration tag. Check for proper error handling and edge cases. Test both success and failure paths."
    - path: "*.md"
      instructions: "Documentation files. Follow Markdown best practices. Keep documentation accurate and up-to-date. Update README.md when adding new client capabilities. AGENTS.md is the single source of truth for project guidelines."
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
