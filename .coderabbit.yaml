code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "gopiano.go"
        instructions: 'Package-level doc: Describe the package purpose and link to Pandora API documentation. Exported types/functions: Use complete sentences starting with the name. For Client methods, format: ''MethodName does X. Calls API method "api.methodName".'' Include parameter descriptions and return value descriptions.'
      - path: "auth.go"
        instructions: 'Client methods: Format as ''MethodName does X. Calls API method "api.methodName".'' Describe what the method does, what it returns, and any side effects (e.g., setting auth tokens on client). Use complete sentences. Start with the method name.'
      - path: "station.go"
        instructions: 'Client methods: Format as ''MethodName does X. Calls API method "api.methodName".'' Describe what the method does and what it returns. Use complete sentences. Start with the method name.'
      - path: "user.go"
        instructions: 'Client methods: Format as ''MethodName does X. Calls API method "api.methodName".'' Describe what the method does and what it returns. Use complete sentences. Start with the method name.'
      - path: "misc.go"
        instructions: 'Client methods: Format as ''MethodName does X. Calls API method "api.methodName".'' Describe what the method does and what it returns. Use complete sentences. Start with the method name.'
      - path: "requests/*.go"
        instructions: "Package-level doc: 'Package requests provides structs for use with json.Marshal when sending requests to the Pandora API.' Struct doc: 'MethodName represents the request data for api.methodName.' Field comments: Explain purpose, required vs optional, and any constraints."
      - path: "responses/*.go"
        instructions: "Package-level doc: 'Package responses provides structs for use with json.Unmarshal when receiving responses from the Pandora API.' Struct doc: 'MethodName represents the response from api.methodName.' Field comments: Explain what the field contains and when it's present."
  unit_tests:
    path_instructions:
      - path: "*_test.go"
        instructions: "Use table-driven tests with subtests. Format: TestName_Scenario. Use t.Parallel() when safe. For integration tests, add //go:build integration at top. Test both success and error paths. Use t.Helper() for helper functions. Check error wrapping with errors.Is/errors.As. Use testify/assert or standard testing package. Keep tests deterministic - no time.Sleep, use time.Now() carefully. Test edge cases: empty inputs, nil values, invalid data."
      - path: "*_integration_test.go"
        instructions: "Integration tests require //go:build integration tag. Skip with t.Skip() if testing.Short(). These tests make actual API calls and require valid credentials. Test real API interactions, not mocks. Use t.Logf() for debugging output."
      - path: "gopiano_test.go"
        instructions: "Integration test file. Use //go:build integration tag. Set up shared test client in Test_Setup. Each test should be independent. Skip network tests in short mode. Test actual API responses and error handling."
